{% extends 'base.html' %}

{% block title %}Set Slot Limit{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
    <h2 style="color: #667eea; text-align: center;">Slot and Date Limit</h2>
    <form method="post" style="margin-top: 2rem;">
        {% csrf_token %}
        <div class="form-group">
            <label for="slot_limit">Slot Available</label>
            <input type="number" name="slot_limit" id="slot_limit" class="form-control" min="1" value="{{ current_limit }}" required>
        </div>
        <div class="form-group">
            <label for="end_date">End Date</label>
            <input type="date" name="end_date" id="end_date" class="form-control" value="{{ end_date }}" min="{{ today|date:'Y-m-d' }}">
        </div>
        <div style="text-align: center; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
    {% if start_date and end_date %}
    <div style="margin-top: 1rem; text-align: center; color: #667eea;">
        <strong>Current Range:</strong> {{ start_date }} to {{ end_date }}
    </div>
    {% endif %}
</div>
{% endblock %}
